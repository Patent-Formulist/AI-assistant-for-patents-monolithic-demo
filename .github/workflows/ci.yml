name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install ruff
        # Only the dev group: the pinned ruff from uv.lock
        run: uv sync --locked --only-group dev

      - name: Lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Format
        run: uv run --no-sync ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: formulist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d formulist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: test
      DATABASE_PASSWORD: test
      DATABASE_NAME: formulist_test
      # Settings require them; alembic reads the database from the settings too
      JWT_SECRET_KEY: ci-only-jwt-secret-key-0123456789abcdef
      ROSPATENT_API_KEY: ci-only-rospatent-key
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml
        run: uv sync --locked

      - name: Cache Temporal test server
        uses: actions/cache@v4
        with:
          path: .temporal-test-server
          key: temporal-test-server-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Migrations apply to an empty database
        run: uv run --no-sync alembic upgrade head

      - name: Models match migrations
        run: uv run --no-sync alembic check

      - name: Tests
        # DAO tests recreate the schema from the models in the same database
        run: uv run --no-sync pytest --cov=app --cov=core --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
