# Dev: nginx — просто прокси. Токен проверяет бэкенд
# (core/dependencies/auth.py), поэтому auth_request здесь больше нет.

# ─── Лимиты запросов к авторизации, по IP клиента ────────────────────────────
# Зоны объявлены здесь, а не в nginx.conf: этот файл смонтирован в контейнер,
# и для правок достаточно перезапуска nginx, без пересборки образа.
# Регистрация: в среднем 3 в минуту (1 раз в 20 с), подряд не больше 4 (1 + burst 3).
# Вход: в среднем 10 в минуту (1 раз в 6 с), подряд не больше 6 (1 + burst 5).
# Сверх лимита — 429, до бэкенда запрос не доходит.
limit_req_zone $binary_remote_addr zone=registration:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;

    # Долгие пайплайны (Роспатент + LLM) — 30 минут
    proxy_connect_timeout       1800s;
    proxy_send_timeout          1800s;
    proxy_read_timeout          1800s;
    send_timeout                1800s;
    client_body_timeout         1800s;
    client_header_timeout       1800s;
    keepalive_timeout           1800s;

    access_log  /var/log/nginx/access.log combined;
    error_log   /var/log/nginx/error.log warn;

    # ─── CORS ─────────────────────────────────────────────────────────────────
    # Заголовки заданы один раз на весь server и наследуются локациями
    # (у которых нет своего add_header). $cors_origin — map из nginx.conf:
    # он отдаёт origin только если тот в белом списке, иначе пустую строку.
    add_header 'Access-Control-Allow-Origin'      $cors_origin always;
    add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
    add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, x-device-id' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Max-Age'           86400 always;

    # Preflight не доходит до бэкенда
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ─── Авторизация: с лимитами (зоны в начале файла) ────────────────────────
    location = /api/v2/users/registration {
        limit_req zone=registration burst=3 nodelay;
        proxy_pass http://backend:8000;
        include snippets/proxy.conf;
    }

    location = /api/v2/users/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8000;
        include snippets/proxy.conf;
    }

    # ─── API ──────────────────────────────────────────────────────────────────
    # Остальной /api/v2/ одной локацией: авторизацию целиком выполняет бэкенд.
    location /api/v2/ {
        proxy_pass http://backend:8000;
        include snippets/proxy.conf;
    }

    # ─── Swagger ──────────────────────────────────────────────────────────────
    location /docs {
        proxy_pass http://backend:8000/docs;
        include snippets/proxy.conf;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        include snippets/proxy.conf;
    }

    # ─── Health check ─────────────────────────────────────────────────────────
    # The backend's own check (database, Temporal): an outside monitor sees the
    # whole chain. 503 from the backend, 502 if it does not answer at all.
    location = /health {
        access_log off;
        proxy_pass http://backend:8000/health;
        include snippets/proxy.conf;
    }

    # ─── Frontend (vite dev server) ───────────────────────────────────────────
    location / {
        proxy_pass http://frontend:3000;
        include snippets/proxy.conf;
        proxy_buffering off;

        # WebSocket для Vite HMR
        proxy_http_version  1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
