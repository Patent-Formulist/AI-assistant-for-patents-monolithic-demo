# Prod: nginx — TLS-терминатор и прокси. Токен проверяет бэкенд
# (core/dependencies/auth.py), поэтому auth_request здесь больше нет.

# ─── Лимиты запросов к авторизации, по IP клиента ────────────────────────────
# Зоны объявлены здесь, а не в nginx.conf: этот файл смонтирован в контейнер,
# и для правок достаточно перезапуска nginx, без пересборки образа.
# Регистрация: в среднем 3 в минуту (1 раз в 20 с), подряд не больше 4 (1 + burst 3).
# Вход: в среднем 10 в минуту (1 раз в 6 с), подряд не больше 6 (1 + burst 5).
# Сверх лимита — 429, до бэкенда запрос не доходит.
limit_req_zone $binary_remote_addr zone=registration:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 443 ssl;
    http2 on;
    server_name formulinked.ru www.formulinked.ru;

    # ─── SSL ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/formulinked.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/formulinked.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ─── Долгие пайплайны (Роспатент + LLM) — 30 минут ────────────────────────
    proxy_connect_timeout       1800s;
    proxy_send_timeout          1800s;
    proxy_read_timeout          1800s;
    send_timeout                1800s;
    client_body_timeout         1800s;
    client_header_timeout       1800s;
    keepalive_timeout           1800s;

    access_log  /var/log/nginx/access.log combined;
    error_log   /var/log/nginx/error.log warn;

    # ─── CORS ─────────────────────────────────────────────────────────────────
    # Один набор заголовков на весь server: раньше в каждой локации стояло
    # по два add_header с одним именем, из которых браузер видел только последний.
    # $cors_origin — map из nginx.conf.
    add_header 'Access-Control-Allow-Origin'      $cors_origin always;
    add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
    add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, x-device-id' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Max-Age'           86400 always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # ─── Авторизация: с лимитами (зоны в начале файла) ────────────────────────
    location = /api/v2/users/registration {
        limit_req zone=registration burst=3 nodelay;
        proxy_pass http://formulinked-monolith:8000;
        include snippets/proxy.conf;
        access_log /var/log/nginx/access.log combined;
    }

    location = /api/v2/users/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://formulinked-monolith:8000;
        include snippets/proxy.conf;
        access_log /var/log/nginx/access.log combined;
    }

    # ─── API ──────────────────────────────────────────────────────────────────
    location /api/v2/ {
        proxy_pass http://formulinked-monolith:8000;
        include snippets/proxy.conf;
        access_log /var/log/nginx/access.log combined;
    }

    # Swagger (/docs, /openapi.json) наружу не публикуется: только через
    # SSH-туннель на 127.0.0.1:8000 (см. deploy/README.md, "Служебные интерфейсы")

    # ─── Health check ─────────────────────────────────────────────────────────
    # The backend's own check (database, Temporal): an outside monitor sees the
    # whole chain. 503 from the backend, 502 if it does not answer at all.
    location = /health {
        access_log off;
        proxy_pass http://formulinked-monolith:8000/health;
        include snippets/proxy.conf;
    }

    # ─── Frontend (собранный dist за nginx) ───────────────────────────────────
    location / {
        proxy_pass http://formulinked-frontend:80;
        include snippets/proxy.conf;
    }
}

# ─── HTTP: редирект на HTTPS и ACME-челлендж ──────────────────────────────────
server {
    listen 80;
    server_name formulinked.ru www.formulinked.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
