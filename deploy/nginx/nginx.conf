user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ─── CORS whitelist ───────────────────────────────────────────────────────
    # Проблема оригинала: два add_header с одним именем — браузер получает
    # оба заголовка, и некоторые клиенты отклоняют такой ответ.
    # Решение: map возвращает origin только если он в списке, иначе пустую
    # строку. Пустая строка → заголовок не добавляется (т.к. used always).
    map $http_origin $cors_origin {
        default                  "";
        "http://localhost"       $http_origin;
        "http://localhost:3001"  $http_origin;
        "https://formulinked.ru"     $http_origin;
        "https://www.formulinked.ru" $http_origin;
        # добавляй сюда новые origins при необходимости
    }

    # ─── Логи ─────────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      'upstream="$upstream_addr:-"';

    access_log  /var/log/nginx/access.log  main;

    # ─── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    include /etc/nginx/sites-enabled/*.conf;
}
